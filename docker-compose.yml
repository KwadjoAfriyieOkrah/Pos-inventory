
services:
  db:
    image: postgres:16
    container_name: pharmacy-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos_dev_only
      POSTGRES_DB: pos_dev
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

